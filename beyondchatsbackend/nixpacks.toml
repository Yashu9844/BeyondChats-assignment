# Laravel/PHP configuration for Railway
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer"]
aptPkgs = ["libpq-dev", "libzip-dev", "libpng-dev", "libonig-dev", "libxml2-dev", "unzip", "curl"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-dev --no-interaction"]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache", 
    "php artisan view:cache",
    "mkdir -p storage/framework/{sessions,views,cache}",
    "chmod -R 775 storage bootstrap/cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"

[variables]
PHP_VERSION = "8.3"
